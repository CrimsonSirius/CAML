name: Package Linux

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Resolve package identity
        id: package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            if [ -z "$version" ]; then
              version="1.0.0"
            fi
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="1.0.0"
            release="${{ github.event.pull_request.number }}"
            artifact="caml-linux-packages-pr-$release"
          else
            version="1.0.0"
            message=$(git log -1 --pretty=%B)
            pr=$(printf '%s\n' "$message" | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p' | head -n 1)
            if [ -z "$pr" ]; then
              pr=$(printf '%s\n' "$message" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -n 1)
            fi
            if [ -n "$pr" ]; then
              release="$pr"
              artifact="caml-linux-packages-pr-$pr"
            else
              release="$GITHUB_RUN_NUMBER"
              artifact="caml-linux-packages-run-$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Build Linux packages
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew packageLinux \
            -PcamlJdkHome="$JAVA_HOME" \
            -PcamlVersion="${{ steps.package.outputs.version }}" \
            -PcamlRelease="${{ steps.package.outputs.release }}" \
            --no-daemon --stacktrace
      - name: Inspect packages
        run: |
          deb=$(find build/packages/linux -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find build/packages/linux -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$deb"
          test -n "$rpm"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" >/dev/null
          mkdir -p .rpmdb
          rpm --dbpath "$PWD/.rpmdb" -qpi "$rpm"
          rpm --dbpath "$PWD/.rpmdb" -qpl "$rpm" >/dev/null
          cat build/packages/linux/SHA256SUMS.txt
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/packages/linux/*.deb
            build/packages/linux/*.rpm
            build/packages/linux/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: caml-linux-packages
          path: packages
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "CAML $GITHUB_REF_NAME" || \
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber
