name: Package Linux

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # 被 Build 以 workflow_call 调用时 github.workflow 是调用方的名字，
  # 若两个打包 workflow 都用 ${{ github.workflow }}，Linux 与 Windows 会落进同一个
  # group 而被迫串行。这里用固定前缀区分，并按 ref 隔离。
  group: caml-linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    # ubuntu-22.04（glibc 2.35）比 latest 旧，产出的运行时对更多发行版可用。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Resolve package identity
        id: package
        # 输入通过环境变量传入，不直接拼进 shell；并在打包前校验版本格式，
        # 免得 tag 带后缀（v1.0.0-beta）时直到 Gradle 阶段才报错。
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              version="1.0.0"
            fi
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="1.0.0"
            release="${{ github.event.pull_request.number }}"
            artifact="caml-linux-packages-pr-$release"
          else
            version="1.0.0"
            message=$(git log -1 --pretty=%B)
            pr=$(printf '%s\n' "$message" | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p' | head -n 1)
            if [ -z "$pr" ]; then
              pr=$(printf '%s\n' "$message" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -n 1)
            fi
            if [ -n "$pr" ]; then
              release="$pr"
              artifact="caml-linux-packages-pr-$pr"
            else
              release="$GITHUB_RUN_NUMBER"
              artifact="caml-linux-packages-run-$GITHUB_RUN_NUMBER"
            fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::版本号必须是数字和点组成（例如 1.0.0），当前：$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Build Linux packages
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CAML_MICROSOFT_CLIENT_ID: ${{ secrets.CAML_MICROSOFT_CLIENT_ID }}
        run: |
          ./gradlew packageLinux \
            "-PcamlJdkHome=$JAVA_HOME" \
            "-PcamlVersion=${{ steps.package.outputs.version }}" \
            "-PcamlRelease=${{ steps.package.outputs.release }}" \
            --no-daemon --stacktrace
      - name: Inspect packages
        run: |
          set -euo pipefail
          deb=$(find build/packages/linux -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find build/packages/linux -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$deb"
          test -n "$rpm"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" >/dev/null
          dbpath="$RUNNER_TEMP/rpmdb"
          rm -rf "$dbpath"
          mkdir -p "$dbpath"
          rpm --dbpath "$dbpath" -qpi "$rpm"
          rpm --dbpath "$dbpath" -qpl "$rpm" >/dev/null
          cat build/packages/linux/SHA256SUMS.txt
      - name: Smoke test packaged app-image
        # 用 app-image 自身的启动配置启动后端，并校验裁剪运行时的模块集与 --strip-native-commands。
        run: ./gradlew smokeTestPackagedApp "-PcamlJdkHome=$JAVA_HOME" --no-daemon

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: caml-linux-packages
          path: packages
      - name: Rename Linux checksum
        run: mv packages/SHA256SUMS.txt packages/SHA256SUMS-linux.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release job 没有 checkout，工作目录里没有 .git，gh 无法从 remote 推断仓库，
          # 必须显式指定，否则 gh release 会以 "no git remotes found" 失败。
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "CAML $GITHUB_REF_NAME" || \
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber