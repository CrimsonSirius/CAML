name: Package Linux

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # 被 Build 以 workflow_call 调用时 github.workflow 是调用方的名字，
  # 若两个打包 workflow 都用 ${{ github.workflow }}，Linux 与 Windows 会落进同一个
  # group 而被迫串行。这里用固定前缀区分，并按 ref 隔离。
  group: caml-linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    # ubuntu-22.04（glibc 2.35）比 latest 旧，产出的运行时对更多发行版可用。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Resolve package identity
        id: package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            if [ -z "$version" ]; then
              version="1.0.0"
            fi
            release="1"
            artifact="caml-linux-packages"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="1.0.0"
            release="${{ github.event.pull_request.number }}"
            artifact="caml-linux-packages-pr-$release"
          else
            version="1.0.0"
            message=$(git log -1 --pretty=%B)
            pr=$(printf '%s\n' "$message" | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p' | head -n 1)
            if [ -z "$pr" ]; then
              pr=$(printf '%s\n' "$message" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -n 1)
            fi
            if [ -n "$pr" ]; then
              release="$pr"
              artifact="caml-linux-packages-pr-$pr"
            else
              release="$GITHUB_RUN_NUMBER"
              artifact="caml-linux-packages-run-$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Build Linux packages
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew packageLinux \
            "-PcamlJdkHome=$JAVA_HOME" \
            "-PcamlVersion=${{ steps.package.outputs.version }}" \
            "-PcamlRelease=${{ steps.package.outputs.release }}" \
            --no-daemon --stacktrace
      - name: Inspect packages
        run: |
          set -euo pipefail
          deb=$(find build/packages/linux -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find build/packages/linux -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$deb"
          test -n "$rpm"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" >/dev/null
          dbpath="$RUNNER_TEMP/rpmdb"
          rm -rf "$dbpath"
          mkdir -p "$dbpath"
          rpm --dbpath "$dbpath" -qpi "$rpm"
          rpm --dbpath "$dbpath" -qpl "$rpm" >/dev/null
          cat build/packages/linux/SHA256SUMS.txt
      - name: Smoke test packaged backend
        # 用与安装包相同的 --module-path 布局启动后端：
        # app 目录下的 jar 会以命名（自动）模块加载，跨模块资源可见性问题只在这里暴露。
        run: |
          set -euo pipefail
          image="build/packages/linux/app-image/CAML"
          test -d "$image"
          # 自动定位 jar 所在目录，避免依赖 jpackage 的具体布局（Linux 为 lib/app）。
          jar=$(find "$image" -name 'CAMLBackend-*.jar' -print -quit)
          test -n "$jar"
          app=$(dirname "$jar")
          echo "app dir: $app"
          classes="$RUNNER_TEMP/smoke-classes"
          rm -rf "$classes"
          mkdir -p "$classes"
          javac -encoding UTF-8 -d "$classes" -cp "$app/*" packaging/smoke/BackendSmoke.java
          java --module-path "$app" \
            --add-modules=javafx.controls,javafx.fxml \
            -cp "$classes:$app/*" \
            BackendSmoke "$RUNNER_TEMP/smoke-data" "$RUNNER_TEMP/smoke-game"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/packages/linux/*.deb
            build/packages/linux/*.rpm
            build/packages/linux/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: caml-linux-packages
          path: packages
      - name: Rename Linux checksum
        run: mv packages/SHA256SUMS.txt packages/SHA256SUMS-linux.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "CAML $GITHUB_REF_NAME" || \
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber