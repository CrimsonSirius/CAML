name: Package Windows

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # 与 package-linux.yml 一样使用固定前缀：被 Build 调用时 github.workflow 是调用方名字，
  # 用 ${{ github.workflow }} 会让两个平台的打包互相排队。
  group: caml-windows-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Resolve package identity
        id: package
        shell: bash
        # 输入通过环境变量传入，不直接拼进 shell；并在打包前校验版本格式，
        # 免得 tag 带后缀（v1.0.0-beta）时直到 Gradle 阶段才报错。
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release="1"
            artifact="caml-windows-packages"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              version="1.0.0"
            fi
            release="1"
            artifact="caml-windows-packages"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="1.0.0"
            release="${{ github.event.pull_request.number }}"
            artifact="caml-windows-packages-pr-$release"
          else
            version="1.0.0"
            message=$(git log -1 --pretty=%B)
            pr=$(printf '%s\n' "$message" | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p' | head -n 1)
            if [ -z "$pr" ]; then
              pr=$(printf '%s\n' "$message" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -n 1)
            fi
            if [ -n "$pr" ]; then
              release="$pr"
              artifact="caml-windows-packages-pr-$pr"
            else
              release="$GITHUB_RUN_NUMBER"
              artifact="caml-windows-packages-run-$GITHUB_RUN_NUMBER"
            fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::版本号必须是数字和点组成（例如 1.0.0），当前：$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Diagnose packaging JDK
        # 打包失败的常见根源是 runner 上的 JDK 不含 jpackage/jlink 或供应商不符；
        # 这里把判定依据直接写进 Run Summary，省去翻日志。
        # 脚本正文保持 ASCII：GitHub 把 run 保存为无 BOM 的 UTF-8，
        # 非 ASCII 字符在不同 PowerShell 版本下的解码方式可能不一致。
        shell: pwsh
        run: |
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('### Packaging JDK (Windows)')
          $lines.Add('```text')
          $lines.Add("JAVA_HOME=$env:JAVA_HOME")
          $release = Join-Path $env:JAVA_HOME 'release'
          if (Test-Path $release) {
            Get-Content $release |
              Select-String -Pattern '^(IMPLEMENTOR|JAVA_VERSION|OS_ARCH|IMAGE_TYPE)=' |
              ForEach-Object { $lines.Add($_.Line) }
          } else {
            $lines.Add('release: MISSING')
          }
          foreach ($tool in @('jpackage.exe', 'jlink.exe', 'javac.exe')) {
            $path = Join-Path $env:JAVA_HOME "bin\$tool"
            $state = if (Test-Path $path) { 'ok' } else { 'MISSING' }
            $lines.Add("${tool}: $state")
          }
          $lines.Add('```')
          $report = $lines -join "`n"
          Write-Output $report
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report
          .\gradlew.bat printPackagingJdk --no-daemon
      - name: Ensure WiX Toolset 3.14
        id: wix
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          )
          function Find-WixBin($paths) {
            foreach ($path in $paths) {
              if (Test-Path (Join-Path $path 'candle.exe')) { return $path }
            }
            return $null
          }
          $wixBin = Find-WixBin $candidates
          if (-not $wixBin) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $wixBin = Find-WixBin $candidates
          }
          if (-not $wixBin) { throw "WiX Toolset 3.14 not found after installation" }
          if (-not (Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw "WiX light.exe missing in $wixBin"
          }
          Write-Host "WiX bin: $wixBin"
          "path=$wixBin" >> $env:GITHUB_OUTPUT
      - name: Build Windows packages
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CAML_MICROSOFT_CLIENT_ID: ${{ secrets.CAML_MICROSOFT_CLIENT_ID }}
          WIX_BIN: ${{ steps.wix.outputs.path }}
        run: |
          $env:PATH = "$env:WIX_BIN;$env:PATH"
          Get-Command candle.exe | Format-List Source
          .\gradlew.bat packageWindows `
            "-PcamlJdkHome=$env:JAVA_HOME" `
            "-PcamlVersion=${{ steps.package.outputs.version }}" `
            "-PcamlRelease=${{ steps.package.outputs.release }}" `
            --no-daemon --stacktrace
      - name: Inspect packages
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/packages/windows -Filter '*.exe' | Select-Object -First 1
          $zip = Get-ChildItem build/packages/windows -Filter '*.zip' | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE installer not found" }
          if (-not $zip) { throw "Windows portable ZIP not found" }
          $exe | Format-List Name, Length
          $zip | Format-List Name, Length
          Get-Content build/packages/windows/SHA256SUMS.txt
      - name: Smoke test packaged app-image
        shell: pwsh
        # 用 app-image 自身的 CAML.cfg 启动后端，并校验裁剪运行时的模块集与 --strip-native-commands。
        run: .\gradlew.bat smokeTestPackagedApp "-PcamlJdkHome=$env:JAVA_HOME" --no-daemon
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/packages/windows/*.exe
            build/packages/windows/*.zip
            build/packages/windows/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: caml-windows-packages
          path: packages
      - name: Rename Windows checksum
        run: mv packages/SHA256SUMS.txt packages/SHA256SUMS-windows.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release job 没有 checkout，工作目录里没有 .git，gh 无法从 remote 推断仓库，
          # 必须显式指定，否则 gh release 会以 "no git remotes found" 失败。
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "CAML $GITHUB_REF_NAME" || \
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber