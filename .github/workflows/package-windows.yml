name: Package Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
        default: 1.0.0
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve package identity
        id: package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release="1"
            artifact="caml-windows-packages"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            if [ -z "$version" ]; then
              version="1.0.0"
            fi
            release="1"
            artifact="caml-windows-packages"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="1.0.0"
            release="${{ github.event.pull_request.number }}"
            artifact="caml-windows-packages-pr-$release"
          else
            version="1.0.0"
            message=$(git log -1 --pretty=%B)
            pr=$(printf '%s\n' "$message" | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p' | head -n 1)
            if [ -z "$pr" ]; then
              pr=$(printf '%s\n' "$message" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -n 1)
            fi
            if [ -n "$pr" ]; then
              release="$pr"
              artifact="caml-windows-packages-pr-$pr"
            else
              release="$GITHUB_RUN_NUMBER"
              artifact="caml-windows-packages-run-$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Ensure WiX Toolset 3.14
        id: wix
        shell: pwsh
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path "$wixBin\candle.exe")) {
            throw "WiX Toolset 3.14 installation failed"
          }
          Write-Host "WiX bin: $wixBin"
          "path=$wixBin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build Windows packages
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          WIX_BIN: ${{ steps.wix.outputs.path }}
        run: |
          $env:PATH = "$env:WIX_BIN;$env:PATH"
          Get-Command candle.exe | Format-List Source
          .\gradlew.bat packageWindows `
            "-PcamlJdkHome=$env:JAVA_HOME" `
            "-PcamlVersion=${{ steps.package.outputs.version }}" `
            "-PcamlRelease=${{ steps.package.outputs.release }}" `
            --no-daemon --stacktrace
      - name: Inspect packages
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/packages/windows -Filter '*.exe' | Select-Object -First 1
          $zip = Get-ChildItem build/packages/windows -Filter '*.zip' | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE installer not found" }
          if (-not $zip) { throw "Windows portable ZIP not found" }
          $exe | Format-List Name, Length
          $zip | Format-List Name, Length
          Get-Content build/packages/windows/SHA256SUMS.txt
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/packages/windows/*.exe
            build/packages/windows/*.zip
            build/packages/windows/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: caml-windows-packages
          path: packages
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "CAML $GITHUB_REF_NAME" || \
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber
